name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Spin up a temporary PostgreSQL database just for this test run
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: job_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Run TypeScript check
      run: npx tsc --noEmit

    - name: Run tests
      env:
        NODE_ENV: test
        PORT: 5001
        # Point to the local Postgres service container
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/job_tracker_test
        DIRECT_URL: postgresql://postgres:postgres@localhost:5432/job_tracker_test
        JWT_ACCESS_SECRET: test-access-secret-min-32-chars-long-for-tests-xxx
        JWT_REFRESH_SECRET: test-refresh-secret-min-32-chars-long-for-tests-yyy
        JWT_ACCESS_EXPIRES_IN: 15m
        JWT_REFRESH_EXPIRES_IN: 7d
        CORS_ORIGIN: http://localhost:3000
      run: npm test